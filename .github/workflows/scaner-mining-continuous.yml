name: Public Mining continuous worker

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: scaner-mining-continuous
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      PUBLIC_MINING_DURATION_SECONDS: '19200'
      PUBLIC_MINING_CHECKPOINT_SECONDS: '600'
      PUBLIC_MINING_GIT_CHECKPOINT: '1'
      PUBLIC_MINING_MAX_FAILURES: '3'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Validate public Mining worker
        run: |
          test -n "$BETSAPI_KEY"
          python3 -m py_compile scaner_mining_worker.py scanner.py stateful_goal_mining.py

      - name: Configure Git identity
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run public Mining worker
        id: worker
        run: python3 scaner_mining_worker.py

      - name: Show status
        if: always() && steps.worker.outcome != 'skipped'
        run: cat mining_log/public_worker_status.json
