name: Verify default TB statistics and paused under rules
on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/statistics_format.py'
      - '.github/scripts/test_statistics_format.py'
      - '.github/scripts/refresh_live_results.py'
      - '.github/scripts/test_refresh_live_results.py'
      - '.github/workflows/verify-statistics-format.yml'
      - 'research/selection-lab-20261018/refined_pockets.py'
      - '.github/live-refined-pockets.json'
      - '.github/live-external-pockets.json'
      - 'research/selection-lab-20261018/external_pockets.py'
      - 'research/selection-lab-20261018/test_external_pockets.py'
      - 'research/selection-lab-20261018/test_refined_pockets.py'
      - 'research/selection-lab-20261018/seven_direction_pockets.py'
      - 'research/selection-lab-20261018/test_seven_direction_pockets.py'
      - '.github/live-under-pockets.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify sorting, thresholds, comparison and canonical renderer
        env:
          PYTHONPATH: .github/scripts
        run: python3 -m unittest discover -s .github/scripts -p 'test_*statistics*.py' -v
      - name: Verify refresh comparison
        env:
          PYTHONPATH: .github/scripts
        run: python3 -m unittest discover -s .github/scripts -p test_refresh_live_results.py -v
      - name: Verify paused TM and continuous TB history
        env:
          PYTHONPATH: research/selection-lab-20261018
        run: python3 -m unittest discover -s research/selection-lab-20261018 -p test_seven_direction_pockets.py -v


      - name: Verify independent refinement ledgers and delayed exact entries
        run: python3 -m unittest discover -s research/selection-lab-20261018 -p 'test_refined_pockets.py' -v

      - name: Verify prospective external TB hypotheses and persistence
        run: python3 -m unittest discover -s research/selection-lab-20261018 -p 'test_external_pockets.py' -v
