name: Replay historical ranking on frozen observed candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/live-selection-version-replay.yml'
      - '.github/scripts/replay_selection_versions.py'
permissions:
  contents: write
concurrency:
  group: explicit-selection-version-replay
  cancel-in-progress: false
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/selection-lab-20261018
          path: collector
          fetch-depth: 1
      - name: Replay frozen v6 v7 and v8 ranking functions on identical saved candidates
        env:
          COLLECTOR_ROOT: ${{ github.workspace }}/collector
          CONTROL_ROOT: ${{ github.workspace }}/control
        run: python3 control/.github/scripts/replay_selection_versions.py
