name: Temporary EPL 500 first-half yellow card study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-epl-500-yellow-cards.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Analyze last 500 EPL matches
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          BASE="https://api.b365api.com"
          TOKEN=os.environ["BETSAPI_KEY"]
          LEAGUE_ID="94"
          YELLOW_RE=re.compile(r"(?i)\bYellow Card\b")
          TEAM_RE=re.compile(r"~\(([^()]*)\)\s*$")
          MINUTE_RE=re.compile(r"(?<!\d)(\d{1,3})(?:\+(\d{1,2}))?['’]?")

          def get(path,retries=5,**params):
              params["token"]=TOKEN
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"dzam-epl-500-study/1.0"})
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(req,timeout=40) as response:
                          return json.load(response)
                  except Exception:
                      if attempt==retries-1: raise
                      time.sleep(1.5*(attempt+1))

          base_rows=[]; seen=set()
          for page in range(1,18):
              payload=get("/v3/events/ended",sport_id=1,league_id=LEAGUE_ID,page=page)
              rows=payload.get("results") or []
              if isinstance(rows,dict):
                  rows=rows.get("events") or rows.get("results") or []
              for row in rows:
                  eid=str(row.get("id") or "")
                  if eid and eid not in seen and str(row.get("time_status"))=="3":
                      seen.add(eid); base_rows.append(row)
              if len(base_rows)>=550 or not rows: break
          base_rows.sort(key=lambda r:(int(r.get("time") or 0),int(r.get("id") or 0)),reverse=True)
          base_rows=base_rows[:500]
          if len(base_rows)!=500:
              raise RuntimeError(f"Expected 500, got {len(base_rows)}")

          ids=[str(r["id"]) for r in base_rows]
          def batch_view(batch):
              return get("/v1/event/view",event_id=",".join(batch)).get("results") or []
          details={}
          batches=[ids[i:i+10] for i in range(0,500,10)]
          with ThreadPoolExecutor(max_workers=10) as pool:
              futures=[pool.submit(batch_view,b) for b in batches]
              for f in as_completed(futures):
                  for row in f.result():
                      details[str(row.get("id"))]=row

          def norm(s):
              return re.sub(r"[^a-z0-9]","",(s or "").lower())

          def belongs(label,name):
              a,b=norm(label),norm(name)
              return bool(a and b and (a in b or b in a))

          def parse_score(row,base):
              ss=str(row.get("ss") or base.get("ss") or "")
              m=re.match(r"\s*(\d+)\s*[-:]\s*(\d+)\s*$",ss)
              return (int(m.group(1)),int(m.group(2))) if m else (None,None)

          matches=[]; unresolved=[]; uncertain_team=[]; team_apps=Counter()
          points=Counter(); result_games=Counter()
          own_observations=[]

          for base in base_rows:
              eid=str(base["id"]); row=details.get(eid) or {}
              home=(row.get("home") or base.get("home") or {}).get("name") or "UNKNOWN_HOME"
              away=(row.get("away") or base.get("away") or {}).get("name") or "UNKNOWN_AWAY"
              team_apps[home]+=1; team_apps[away]+=1
              hs,as_=parse_score(row,base)
              if hs is not None:
                  result_games[home]+=1; result_games[away]+=1
                  if hs>as_: points[home]+=3
                  elif hs<as_: points[away]+=3
                  else: points[home]+=1; points[away]+=1

              events=row.get("events")
              ts=int(row.get("time") or base.get("time") or 0)
              date=datetime.fromtimestamp(ts,timezone.utc).date().isoformat()
              if not isinstance(events,list):
                  unresolved.append({"id":eid,"date":date,"home":home,"away":away,"reason":"no_events_list"})
                  continue

              marker=next((i for i,e in enumerate(events) if "Score After First Half" in str(e.get("text") or "")),None)
              yellow=[]
              for idx,e in enumerate(events):
                  txt=str(e.get("text") or "")
                  if not YELLOW_RE.search(txt):
                      continue
                  if marker is not None:
                      if idx<marker: yellow.append(txt)
                  else:
                      m=MINUTE_RE.search(txt)
                      if m and int(m.group(1))<=45:
                          yellow.append(txt)

              hyc=ayc=unknown=0
              for txt in yellow:
                  m=TEAM_RE.search(txt)
                  label=m.group(1).strip() if m else ""
                  if belongs(label,home): hyc+=1
                  elif belongs(label,away): ayc+=1
                  else: unknown+=1
              if unknown:
                  uncertain_team.append({"id":eid,"date":date,"home":home,"away":away,"unknown":unknown,"yellow":yellow})

              total=len(yellow)
              match={"id":eid,"date":date,"home":home,"away":away,
                     "home_yc":hyc,"away_yc":ayc,"unknown_yc":unknown,
                     "total_yc":total,"under":total<=1}
              matches.append(match)
              if unknown==0:
                  own_observations.extend([
                      {"team":home,"yc":hyc,"match_id":eid},
                      {"team":away,"yc":ayc,"match_id":eid},
                  ])

          def stat(rows):
              n=len(rows); w=sum(bool(x["under"]) for x in rows); l=n-w
              dist=Counter(x["total_yc"] for x in rows)
              return {"n":n,"wins":w,"losses":l,"hit":w/n if n else None,
                      "profit":w*0.5-l if n else None,
                      "roi":(w*0.5-l)/n if n else None,
                      "fair_odds":n/w if w else None,
                      "avg_yc":sum(x["total_yc"] for x in rows)/n if n else None,
                      "distribution":dict(sorted(dist.items()))}

          overall=stat(matches)
          blocks=[]
          for start in range(0,len(matches),100):
              blocks.append({"range":f"{start+1}-{min(start+100,len(matches))}",
                             **stat(matches[start:start+100])})

          ppg_rank=[]
          for team,n in result_games.items():
              if n>=20:
                  ppg_rank.append({"team":team,"matches":n,"points":points[team],"ppg":points[team]/n})
          ppg_rank.sort(key=lambda x:(x["ppg"],x["matches"]),reverse=True)

          # Traditional Big Six, matched to provider names.
          big6_tokens=("manchestercity","arsenal","liverpool","chelsea","manchesterunited","tottenham")
          big6=set(t for t in team_apps if norm(t) in big6_tokens)
          empirical6=set(x["team"] for x in ppg_rank[:6])

          def tier_analysis(elite):
              cats={
                  "both":[x for x in matches if x["home"] in elite and x["away"] in elite],
                  "one":[x for x in matches if (x["home"] in elite) ^ (x["away"] in elite)],
                  "none":[x for x in matches if x["home"] not in elite and x["away"] not in elite],
                  "any":[x for x in matches if x["home"] in elite or x["away"] in elite],
              }
              out={}
              for k,rows in cats.items():
                  newest=[x for x in rows if matches.index(x)<250]
                  older=[x for x in rows if matches.index(x)>=250]
                  out[k]={"all":stat(rows),"newest250":stat(newest),"older250":stat(older)}
              return out

          def own_stat(obs):
              n=len(obs); total=sum(x["yc"] for x in obs)
              return {"team_match_observations":n,"yellow_cards":total,
                      "avg_own_yc":total/n if n else None,
                      "zero_card_share":sum(x["yc"]==0 for x in obs)/n if n else None,
                      "two_plus_share":sum(x["yc"]>=2 for x in obs)/n if n else None}

          per_team=[]
          for team,count in team_apps.most_common():
              rows=[x for x in matches if x["home"]==team or x["away"]==team]
              if len(rows)<20: continue
              mid=len(rows)//2
              own=[x for x in own_observations if x["team"]==team]
              per_team.append({"team":team,"appearances":len(rows),
                               "all":stat(rows),"latest_half":stat(rows[:mid]),
                               "older_half":stat(rows[mid:]),"own":own_stat(own),
                               "ppg":next((x["ppg"] for x in ppg_rank if x["team"]==team),None)})

          stable=[x for x in per_team if x["appearances"]>=30
                  and x["all"]["hit"]>2/3
                  and x["latest_half"]["hit"]>2/3
                  and x["older_half"]["hit"]>2/3]
          stable.sort(key=lambda x:(x["all"]["roi"],x["appearances"]),reverse=True)

          print("SUMMARY_JSON="+json.dumps({
              "requested":500,"resolved":len(matches),"details":len(details),
              "date_from":base_rows[-1] and datetime.fromtimestamp(int(base_rows[-1].get("time") or 0),timezone.utc).date().isoformat(),
              "date_to":base_rows[0] and datetime.fromtimestamp(int(base_rows[0].get("time") or 0),timezone.utc).date().isoformat(),
              "overall":overall,"blocks":blocks,"unique_teams":len(team_apps),
              "big6":sorted(big6),"empirical_top6":sorted(empirical6),
              "ppg_rank":ppg_rank,"uncertain_team_assignment":len(uncertain_team)
          },ensure_ascii=False,separators=(",",":")))
          print("TIERS_JSON="+json.dumps({
              "traditional_big6":tier_analysis(big6),
              "empirical_top6":tier_analysis(empirical6)
          },ensure_ascii=False,separators=(",",":")))
          print("OWN_JSON="+json.dumps({
              "traditional_big6":own_stat([x for x in own_observations if x["team"] in big6]),
              "traditional_others":own_stat([x for x in own_observations if x["team"] not in big6]),
              "empirical_top6":own_stat([x for x in own_observations if x["team"] in empirical6]),
              "empirical_others":own_stat([x for x in own_observations if x["team"] not in empirical6])
          },ensure_ascii=False,separators=(",",":")))
          print("TEAMS_JSON="+json.dumps(per_team,ensure_ascii=False,separators=(",",":")))
          print("STABLE_JSON="+json.dumps(stable,ensure_ascii=False,separators=(",",":")))
          print("UNRESOLVED_JSON="+json.dumps(unresolved,ensure_ascii=False,separators=(",",":")))
          print("UNCERTAIN_JSON="+json.dumps(uncertain_team,ensure_ascii=False,separators=(",",":")))
          PY
