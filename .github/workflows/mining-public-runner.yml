name: Mining collector on public runner

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: mining-public-continuous-worker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      BETSAPI_TOKEN: ${{ secrets.BETSAPI_TOKEN }}
      MINING_REPO_TOKEN: ${{ secrets.MINING_REPO_TOKEN }}
      MINING_DURATION_SECONDS: '19200'
      MINING_POLL_SECONDS: '300'
      MINING_MORNING_POLL_SECONDS: '600'
      MINING_CHECKPOINT_SECONDS: '600'
      MINING_CYCLE_TIMEOUT_SECONDS: '900'
      MINING_MAX_CONSECUTIVE_FAILURES: '3'
      MINING_CHECKPOINT_ENABLED: '1'
    steps:
      - name: Check required secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$MINING_REPO_TOKEN" ]]; then
            echo 'MINING_REPO_TOKEN is missing in Dzammbo/Scaner'
            exit 1
          fi
          if [[ -z "${BETSAPI_TOKEN:-${BETSAPI_KEY:-}}" ]]; then
            echo 'BETSAPI_TOKEN or BETSAPI_KEY is missing in Dzammbo/Scaner'
            exit 1
          fi

      - name: Checkout private Mining source
        uses: actions/checkout@v4
        with:
          repository: Dzammbo/tennis-research
          ref: main
          path: mining-source
          token: ${{ secrets.MINING_REPO_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore private Mining state
        working-directory: mining-source
        env:
          GH_TOKEN: ${{ secrets.MINING_REPO_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /home/github
          sudo chown -R "$USER":"$USER" /home/github
          if gh release view mining-runtime-current -R Dzammbo/tennis-research >/dev/null 2>&1; then
            gh release download mining-runtime-current -R Dzammbo/tennis-research -p mining-runtime-current.tar.gz --clobber
            tar -xzf mining-runtime-current.tar.gz -C /home/github
          else
            echo 'Private Mining state release is unavailable'
            exit 1
          fi
          find /home/github -maxdepth 3 -type f -name BETSAPI_TOKEN -delete

      - name: Validate Mining source
        working-directory: mining-source
        run: |
          set -euo pipefail
          python3 -m py_compile ops/github/mining_worker.py
          python3 -m compileall -q \
            bet_core \
            research/forward_tests/football_live_fh_totals_v1 \
            research/forward_tests/football_live_ft_totals_v1 \
            research/forward_tests/multisport_live_totals_v1 \
            research/forward_tests/football_live_shock_v1 \
            research/forward_tests/live_goal_selection_v3 \
            research/forward_tests/football_pressure_total_o05_v1 \
            research/forward_tests/late_draw_85_v1 \
            research/forward_tests/football_ht_one_goal_second_half_v1 \
            research/forward_tests/tennis_live_discovery_v1 \
            research/forward_tests/tennis_prior_persistence_v1 \
            research/forward_tests/tennis_state_asymmetry_v2 \
            research/forward_tests/tennis_utr_heavy_set_loss_fade_v1 \
            research/strategy_mining/tennis_mining_pool_v1

      - name: Run Mining from public runner
        id: worker
        working-directory: mining-source
        env:
          GH_TOKEN: ${{ secrets.MINING_REPO_TOKEN }}
          GITHUB_WORKSPACE: ${{ github.workspace }}/mining-source
        run: python3 ops/github/mining_worker.py

      - name: Queue successor on public runner
        if: always() && steps.worker.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mining-public-runner.yml -R Dzammbo/Scaner --ref main
