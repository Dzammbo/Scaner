name: Temporary read-only Events fields diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/events-fields-diagnostic-request.json'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Inspect live football fields without changing Scanner state
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 scripts/diagnose_events_fields.py
