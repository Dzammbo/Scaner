name: Temporary Bet365 full-market probe
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/temp-bet365-full-market-probe.yml"
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - name: Probe full Bet365 markets
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.parse, urllib.request
          BASE="https://api.b365api.com"; TOKEN=os.environ["BETSAPI_KEY"]
          def get(path, **params):
              params["token"]=TOKEN
              req=urllib.request.Request(BASE+path+"?"+urllib.parse.urlencode(params),headers={"User-Agent":"dzam-bet365-full-probe/1.0"})
              with urllib.request.urlopen(req,timeout=20) as r: return json.load(r)
          def flat(v):
              out=[]
              if isinstance(v,list):
                  for x in v: out.extend(flat(x))
              elif isinstance(v,dict): out.append(v)
              return out
          ip=get("/v1/bet365/inplay_filter",sport_id=1)
          events=[x for x in (ip.get("results") or []) if isinstance(x,dict) and str(x.get("sport_id"))=="1"]
          real=[x for x in events if not re.search(r"esoccer|esports|virtual|simulated",str((x.get("league") or {}).get("name",""))+" "+str((x.get("home") or {}).get("name",""))+" "+str((x.get("away") or {}).get("name","")),re.I)]
          ev=(real or events)[0]
          fi=str(ev.get("id"))
          data=get("/v1/bet365/event",FI=fi)
          erows=flat(data.get("results") or [])
          markets=[]; current=None
          for x in erows:
              if x.get("type")=="MA":
                  current={"name":x.get("NA"),"id":x.get("ID"),"suspended":x.get("SU"),"selections":[]}
                  if re.search(r"goal|total|over.?under",str(x.get("NA","")),re.I): markets.append(current)
                  else: current=None
              elif x.get("type")=="PA" and current is not None and len(current["selections"])<20:
                  current["selections"].append({k:x.get(k) for k in ("NA","HA","OD","SU","ID")})
          out={"ok":bool(data.get("success")),"used_real_event":bool(real),"event":{"FI":fi,"league":(ev.get("league") or {}).get("name"),"name":str((ev.get("home") or {}).get("name"))+" v "+str((ev.get("away") or {}).get("name")),"score":ev.get("ss"),"minute":None},"all_market_count":sum(1 for x in erows if x.get("type")=="MA"),"total_related_market_count":len(markets),"total_related_markets":markets[:60]}
          print("BET365_FULL_PROBE="+json.dumps(out,ensure_ascii=False,separators=(",",":")))
          PY
