          def get(path, params):
              q=dict(params); q["token"]=TOKEN
              req=urllib.request.Request(BASE+path+"?"+urllib.parse.urlencode(q),headers={"User-Agent":"dzam-scaner-settle/1.1"})
              with urllib.request.urlopen(req,timeout=20) as r:
                  return json.loads(r.read().decode("utf-8"))
          
          def f(x):
              try: return float(x)
              except: return None
          
          def hv(x):
              if x is None: return None
              vals=[]
              for p in str(x).replace("/",",").split(","):
                  try: vals.append(float(p.strip()))
                  except: pass
              return sum(vals)/len(vals) if vals else None
          
          def stotal(s):
              try:
                  a,b=map(int,str(s).split("-",1)); return a+b
              except: return None
          
          ids=sorted(set(s["event_id"] for s in SIGNALS))
          final={}
          for i in range(0,len(ids),10):
              p=get("/v1/event/view",{"event_id":",".join(ids[i:i+10])})
              rows=p.get("results") or []
              if isinstance(rows,dict): rows=[rows]
              for e in rows:
                  if isinstance(e,dict): final[str(e.get("id"))]=e
          
          football_ids=sorted(set(s["event_id"] for s in SIGNALS if s["sport"]=="football"))
          odds_cache={}
          for eid in football_ids:
              try:
                  p=get("/v2/event/odds",{"event_id":eid,"source":"bet365","odds_market":"3"})
                  rr=p.get("results") or {}
                  odds_cache[eid]=(rr.get("odds") or {}).get("1_3") or []
              except Exception:
                  odds_cache[eid]=[]
          
          def reconstruct_line(s):
              if s["sport"]!="football": return None
              goals=stotal(s.get("score"))
              if goals is None: return s.get("main_total")
              if s["market"] in ("next_goal_over","next_goal_under","plus_0_5"):
                  return goals+0.5
              if s["market"] not in ("main_over","over"):
                  return None
              ts=int(datetime.fromisoformat(s["ts"].replace("Z","+00:00")).timestamp())+10
              rows=[]
              for r in odds_cache.get(s["event_id"],[]):
                  if not isinstance(r,dict): continue
                  at=int(f(r.get("add_time")) or 0)
                  if at and at>ts: continue
                  rs=str(r.get("ss") or "").replace(":","-")
                  if rs and rs!=s.get("score"): continue
                  od=f(r.get("over_od"))
                  if od is None: continue
                  rows.append((at,r,abs(od-s["odds"])))
              # Best evidence: exact displayed price at the scan state.
              exact=[x for x in rows if x[2] <= 0.011]
              if exact:
                  exact.sort(key=lambda x:x[0], reverse=True)
                  return hv(exact[0][1].get("handicap"))
              # Fallback: reproduce the old scanner selection as of the scan timestamp.
              rows.sort(key=lambda x:x[0], reverse=True)
              if rows:
                  target=goals+1.0
                  for _,r,_ in rows:
                      h=hv(r.get("handicap"))
                      if h is not None and abs(h-target)<0.01:
                          return h
                  return hv(rows[0][1].get("handicap"))
              return s.get("main_total")
          
          def winner_tennis(ss):
              sets=[]
              for tok in str(ss or "").split(","):
                  try:
                      a,b=map(int,tok.split("-",1)); sets.append((a,b))
                  except: pass
              hw=sum(a>b for a,b in sets); aw=sum(b>a for a,b in sets)
              return "home" if hw>aw else "away" if aw>hw else None
          
          def component_profit(total,line,over,odds):
              if over:
                  if total>line: return odds-1
                  if total==line: return 0
                  return -1
              else:
                  if total<line: return odds-1
                  if total==line: return 0
                  return -1
          
          def asian_profit(total,line,over,odds):
              q=round((line-math.floor(line))*100)
              if q==25:
                  a=math.floor(line); b=a+0.5
                  return (component_profit(total,a,over,odds)+component_profit(total,b,over,odds))/2
              if q==75:
                  a=math.floor(line)+0.5; b=math.floor(line)+1.0
                  return (component_profit(total,a,over,odds)+component_profit(total,b,over,odds))/2
              return component_profit(total,line,over,odds)
          
          prepared=[]
          for s in SIGNALS:
              e=final.get(s["event_id"]) or {}
              fs=str(e.get("ss") or "")
              r=dict(s); r["final_score"]=fs
              if s["sport"]=="tennis":
                  r["line"]=None
                  w=winner_tennis(fs)
                  r["profit"]=(s["odds"]-1) if w==s.get("bet_side") else -1
                  r["selection"]="P1" if s.get("bet_side")=="home" else "P2"
              else:
                  line=reconstruct_line(s); r["line"]=line
                  total=stotal(fs)
                  if s["market"] in ("next_goal_over","main_over","over","plus_0_5"):
                      r["profit"]=asian_profit(total,line,True,s["odds"]) if total is not None and line is not None else None
                      r["selection"]="TB "+str(line)
                  elif s["market"]=="next_goal_under":
                      r["profit"]=asian_profit(total,line,False,s["odds"]) if total is not None and line is not None else None
                      r["selection"]="TM "+str(line)
                  else:
                      r["profit"]=None; r["selection"]=s["bet"]
              prepared.append(r)
          
          # Remove repeated/duplicate actual bets. Same event + same side/total is one bet, first appearance wins.
          uniq={}
          for r in prepared:
              key=(r["event_id"],r["selection"])
              if key not in uniq: uniq[key]=r
          bets=list(uniq.values())
          for r in bets:
              p=r.get("profit")
              r["result"]="W" if p is not None and p>1e-9 else "L" if p is not None and p<-1e-9 else "PUSH" if p is not None else "UNRESOLVED"
          wins=sum(r["result"]=="W" for r in bets)
          losses=sum(r["result"]=="L" for r in bets)
          pushes=sum(r["result"]=="PUSH" for r in bets)
          unresolved=sum(r["result"]=="UNRESOLVED" for r in bets)
          profit=sum(r["profit"] for r in bets if r["profit"] is not None)
          settled=sum(r["profit"] is not None for r in bets)
          roi=(profit/settled*100) if settled else None
          out={
            "raw_visible_signals":92,
            "unique_event_strategy":55,
            "unique_matches":len(set(r["event_id"] for r in bets)),
            "unique_bets":len(bets),
            "wins":wins,"losses":losses,"pushes":pushes,"unresolved":unresolved,
            "profit_units":round(profit,4),"roi_pct":round(roi,2) if roi is not None else None,
            "bets":bets
          }
          print("SETTLEMENT_RESULT="+json.dumps(out,ensure_ascii=False,separators=(",",":")))
          
          PY
          python3 /tmp/settle.py
