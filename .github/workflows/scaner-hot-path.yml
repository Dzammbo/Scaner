name: Scanner continuous worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "scanner_worker.py"
      - "strategies.json"
      - ".github/workflows/scaner-hot-path.yml"
  schedule:
    # Hourly watchdog. A queued run takes over when the long worker exits.
    # Minute 37 avoids the busiest start-of-hour scheduling window.
    - cron: "37 * * * *"

permissions:
  contents: write

concurrency:
  group: scaner-forward-log
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      SCANNER_DURATION_SECONDS: "19200"
      SCANNER_POLL_SECONDS: "300"
      SCANNER_CHECKPOINT_SECONDS: "600"
      SCANNER_GIT_CHECKPOINT: "1"
      SCANNER_MAX_CONSECUTIVE_FAILURES: "3"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run continuous Scanner collector
        run: python3 scanner_worker.py

      - name: Show worker status
        if: always()
        run: |
          test -f forward_log/scanner_worker_status.json
          cat forward_log/scanner_worker_status.json
