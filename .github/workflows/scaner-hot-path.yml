name: Scanner continuous worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/scaner-hot-path.yml"
      - "scanner.py"
      - "scanner_worker.py"
      - "strategies.json"

permissions:
  contents: write
  actions: write

concurrency:
  group: scaner-forward-log
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Previous Scanner model is retired
        run: echo "All previous Scanner strategies now run in Mining."
