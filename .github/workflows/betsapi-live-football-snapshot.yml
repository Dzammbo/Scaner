name: Manual BetsAPI live football snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/betsapi-live-football-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - name: Fetch compact live football snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          BASE = "https://api.b365api.com"
          TOKEN = os.environ["BETSAPI_KEY"]
          EXCLUDE = re.compile(
              r"virtual|esoccer|e-soccer|esports|simulated|cyber",
              re.I,
          )
          WOMEN = re.compile(r"women|woman|ladies|femenil|feminina|female|\(w\)", re.I)
          YOUTH = re.compile(r"\bu[- ]?(?:15|16|17|18|19|20|21|22|23)\b|youth|development|juniors?", re.I)
          RESERVE = re.compile(r"reserves?", re.I)

          def category(label):
              if WOMEN.search(label):
                  return "Женский"
              if YOUTH.search(label):
                  return "Молодёжный/юниорский"
              if RESERVE.search(label):
                  return "Резервный"
              return "Взрослый мужской"

          def get(path, **params):
              params["token"] = TOKEN
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "dzam-live-tb/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r), {
                      "status": r.status,
                      "limit": r.headers.get("X-RateLimit-Limit"),
                      "remaining": r.headers.get("X-RateLimit-Remaining"),
                  }

          def name(x):
              return x.get("name") if isinstance(x, dict) else x

          def num(x):
              try:
                  return float(x)
              except Exception:
                  return None

          def integer(x):
              try:
                  return int(float(x))
              except Exception:
                  return None

          def handicap(x):
              vals = [num(v.strip()) for v in str(x or "").replace("/", ",").split(",")]
              vals = [v for v in vals if v is not None]
              return sum(vals) / len(vals) if vals else None

          def latest(rows):
              rows = [r for r in (rows or []) if isinstance(r, dict)]
              return sorted(rows, key=lambda r: integer(r.get("add_time")) or 0, reverse=True)

          def flatten(value):
              out = []
              if isinstance(value, list):
                  for item in value:
                      out.extend(flatten(item))
              elif isinstance(value, dict):
                  out.append(value)
              return out

          def normalized(value):
              return re.sub(r"[^a-z0-9]+", "", str(value or "").lower())

          def decimal_odds(value):
              text = str(value or "").strip()
              if not text:
                  return None
              try:
                  if "/" in text:
                      left, right = text.split("/", 1)
                      denominator = float(right)
                      return 1.0 + float(left) / denominator if denominator else None
                  return float(text)
              except Exception:
                  return None

          def parse_bet365_totals(payload):
              rows = flatten(payload.get("results") or [])
              groups = []
              current = None
              side = None
              excluded = re.compile(r"next goal|\d+(?:st|nd|rd|th) goal|exact|odd.?even|race to|winning margin", re.I)

              for row in rows:
                  row_type = row.get("type")
                  if row_type == "MG":
                      market = str(row.get("NA") or "").strip()
                      low = market.lower()
                      relevant = (
                          "match goals" in low
                          or "goal line" in low
                          or "total goals" in low
                          or (("1st half" in low or "first half" in low) and "goals" in low)
                      )
                      if relevant and not excluded.search(low):
                          period = "first_half" if ("1st half" in low or "first half" in low) else "full_time"
                          current = {
                              "market": market,
                              "period": period,
                              "group_suspended": str(row.get("SU") or "0") == "1",
                              "selections": [],
                          }
                          groups.append(current)
                      else:
                          current = None
                      side = None
                  elif row_type == "MA":
                      side = str(row.get("NA") or "").strip().lower()
                  elif row_type == "PA" and current is not None:
                      line = num(row.get("HA"))
                      price = decimal_odds(row.get("OD"))
                      if line is None or price is None or side not in ("over", "under"):
                          continue
                      current["selections"].append({
                          "side": side,
                          "line": line,
                          "odds": round(price, 4),
                          "suspended": current["group_suspended"] or str(row.get("SU") or "0") == "1",
                      })

              def lines(period):
                  combined = {}
                  for group in groups:
                      if group["period"] != period:
                          continue
                      for selection in group["selections"]:
                          line = selection["line"]
                          row = combined.setdefault(line, {
                              "line": line,
                              "over": None,
                              "under": None,
                              "market": group["market"],
                              "source": "bet365_full_markets",
                          })
                          if not selection["suspended"]:
                              row[selection["side"]] = selection["odds"]
                              row["market"] = group["market"]
                  return [
                      row for _, row in sorted(combined.items())
                      if row.get("over") is not None
                  ][:20]

              return {
                  "full_time": lines("full_time"),
                  "first_half": lines("first_half"),
                  "market_names": [g["market"] for g in groups],
              }

          bet365_filter_error = None
          bet365_filter_meta = None
          try:
              bet365_filter, bet365_filter_meta = get("/v1/bet365/inplay_filter", sport_id=1)
              bet365_rows = [r for r in (bet365_filter.get("results") or []) if isinstance(r, dict)]
          except Exception as exc:
              bet365_rows = []
              bet365_filter_error = type(exc).__name__ + ": " + str(exc)[:180]

          bet365_by_our_event = {
              str(row.get("our_event_id")): str(row.get("id"))
              for row in bet365_rows
              if row.get("our_event_id") and row.get("id")
          }
          bet365_by_names = {
              (
                  normalized(name(row.get("home"))),
                  normalized(name(row.get("away"))),
              ): str(row.get("id"))
              for row in bet365_rows
              if row.get("id") and name(row.get("home")) and name(row.get("away"))
          }

          board, board_meta = get("/v3/events/inplay", sport_id=1)
          raw = [r for r in (board.get("results") or []) if isinstance(r, dict)]
          events = []
          for r in raw:
              league = name(r.get("league")) or ""
              home = name(r.get("home")) or ""
              away = name(r.get("away")) or ""
              label = " ".join((league, home, away))
              minute = integer((r.get("timer") or {}).get("tm"))
              score = str(r.get("ss") or "").replace(":", "-")
              if EXCLUDE.search(label) or minute is None or not (8 <= minute <= 60) or not re.fullmatch(r"\d+-\d+", score):
                  continue
              event_id = str(r.get("id"))
              bet365_fi = bet365_by_our_event.get(event_id)
              if not bet365_fi:
                  bet365_fi = bet365_by_names.get((normalized(home), normalized(away)))
              events.append({
                  "event_id": event_id,
                  "bet365_fi": bet365_fi,
                  "league": league,
                  "country": (r.get("league") or {}).get("cc") if isinstance(r.get("league"), dict) else None,
                  "category": category(label),
                  "home": home,
                  "away": away,
                  "minute": minute,
                  "score": score,
                  "board_stats": r.get("stats"),
              })

          eligible_in_window_count = len(events)
          category_counts = {
              cat: sum(1 for e in events if e["category"] == cat)
              for cat in sorted({e["category"] for e in events})
          }

          # Technical provider-protection limit only. It is not an analytical top.
          TECHNICAL_EVENT_CAP = 100
          events = sorted(events, key=lambda e: (e["minute"], e["league"], e["home"]))[:TECHNICAL_EVENT_CAP]

          def detail(ev):
              try:
                  p, meta = get("/v2/event/odds", event_id=ev["event_id"], source="bet365", odds_market="1,2,3,6")
                  rr = p.get("results") or {}
                  odds = rr.get("odds") or {}
                  score = ev["score"]
                  now = int(time.time())

                  totals = []
                  seen = set()
                  for row in latest(odds.get("1_3")):
                      row_score = str(row.get("ss") or "").replace(":", "-")
                      age = now - integer(row.get("add_time")) if integer(row.get("add_time")) is not None else None
                      line = handicap(row.get("handicap"))
                      over, under = num(row.get("over_od")), num(row.get("under_od"))
                      if row_score and row_score != score:
                          continue
                      if age is not None and not (0 <= age <= 240):
                          continue
                      if line is None or over is None or under is None:
                          continue
                      key = round(line, 3)
                      if key in seen:
                          continue
                      seen.add(key)
                      totals.append({"line": line, "over": over, "under": under, "age_s": age, "quote_score": row_score or score})
                      if len(totals) >= 6:
                          break

                  first_half_totals = []
                  if ev["minute"] <= 45:
                      seen_first_half = set()
                      for row in latest(odds.get("1_6")):
                          row_score = str(row.get("ss") or "").replace(":", "-")
                          age = now - integer(row.get("add_time")) if integer(row.get("add_time")) is not None else None
                          line = handicap(row.get("handicap"))
                          over, under = num(row.get("over_od")), num(row.get("under_od"))
                          if row_score and row_score != score:
                              continue
                          if age is not None and not (0 <= age <= 240):
                              continue
                          if line is None or over is None or under is None:
                              continue
                          key = round(line, 3)
                          if key in seen_first_half:
                              continue
                          seen_first_half.add(key)
                          first_half_totals.append({"line": line, "over": over, "under": under, "age_s": age, "quote_score": row_score or score})
                          if len(first_half_totals) >= 6:
                              break

                  one_x_two = None
                  for row in latest(odds.get("1_1")):
                      row_score = str(row.get("ss") or "").replace(":", "-")
                      age = now - integer(row.get("add_time")) if integer(row.get("add_time")) is not None else None
                      if row_score and row_score != score:
                          continue
                      if age is not None and not (0 <= age <= 240):
                          continue
                      vals = [num(row.get(k)) for k in ("home_od", "draw_od", "away_od")]
                      if all(v is not None for v in vals):
                          one_x_two = {"home": vals[0], "draw": vals[1], "away": vals[2], "age_s": age}
                          break

                  bet365_full_time_totals = []
                  bet365_first_half_totals = []
                  bet365_total_market_names = []
                  bet365_full_market_ok = False
                  bet365_full_market_error = None
                  bet365_fi = ev.get("bet365_fi")
                  if bet365_fi:
                      try:
                          bp, _ = get("/v1/bet365/event", FI=bet365_fi)
                          parsed = parse_bet365_totals(bp)
                          bet365_full_time_totals = parsed["full_time"]
                          bet365_first_half_totals = parsed["first_half"] if ev["minute"] <= 45 else []
                          bet365_total_market_names = parsed["market_names"]
                          bet365_full_market_ok = bool(bp.get("success"))
                      except Exception as exc:
                          bet365_full_market_error = type(exc).__name__ + ": " + str(exc)[:180]
                  else:
                      bet365_full_market_error = "FI not matched"

                  preferred_totals = bet365_full_time_totals or totals
                  preferred_first_half_totals = bet365_first_half_totals or first_half_totals
                  totals_source = "bet365_full_markets" if bet365_full_time_totals else "events_odds_fallback"
                  first_half_totals_source = (
                      "bet365_full_markets"
                      if bet365_first_half_totals
                      else "events_odds_fallback"
                  )

                  out = dict(ev)
                  out.update({
                      "detail_ok": bool(p.get("success")),
                      "detail_stats": rr.get("stats"),
                      "totals": preferred_totals,
                      "first_half_totals": preferred_first_half_totals,
                      "totals_source": totals_source,
                      "first_half_totals_source": first_half_totals_source,
                      "events_main_totals": totals,
                      "events_first_half_totals": first_half_totals,
                      "bet365_full_time_totals": bet365_full_time_totals,
                      "bet365_first_half_totals": bet365_first_half_totals,
                      "bet365_total_market_names": bet365_total_market_names,
                      "bet365_full_market_ok": bet365_full_market_ok,
                      "bet365_full_market_error": bet365_full_market_error,
                      "one_x_two": one_x_two,
                      "api_remaining": meta.get("remaining"),
                  })
                  return out
              except Exception as exc:
                  out = dict(ev)
                  out.update({"detail_ok": False, "error": type(exc).__name__ + ": " + str(exc)[:180]})
                  return out

          detailed = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(detail, ev) for ev in events]
              for f in as_completed(futures):
                  detailed.append(f.result())
          detailed.sort(key=lambda e: (e["minute"], e["league"], e["home"]))

          result = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "BetsAPI / Bet365",
              "board_http": board_meta,
              "bet365_filter_http": bet365_filter_meta,
              "bet365_filter_error": bet365_filter_error,
              "bet365_filter_event_count": len(bet365_rows),
              "bet365_fi_matched_count": sum(1 for e in events if e.get("bet365_fi")),
              "raw_live_count": len(raw),
              "eligible_in_window_count": eligible_in_window_count,
              "detailed_event_count": len(events),
              "technical_event_cap": TECHNICAL_EVENT_CAP,
              "technical_cap_reached": eligible_in_window_count > TECHNICAL_EVENT_CAP,
              "category_counts": category_counts,
              "detail_calls": len(events),
              "raw_sample": [{"id": x.get("id"), "league": name(x.get("league")), "home": name(x.get("home")), "away": name(x.get("away")), "timer": x.get("timer"), "ss": x.get("ss"), "time_status": x.get("time_status")} for x in raw[:15]],
              "events": detailed,
          }
          print("LIVE_SNAPSHOT_JSON=" + json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          PY
