name: Manual BetsAPI live football snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/betsapi-live-football-snapshot.yml"
      - "scripts/live_snapshot.py"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Fetch compact live football snapshot
        run: python3 scripts/live_snapshot.py
