name: Manual BetsAPI live football snapshot

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: 'Empty: full scan. Otherwise 1-3 comma-separated IDs for refresh.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/live-request.json'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Fetch compact live football snapshot
        id: live
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          EVENT_IDS: ${{ inputs.event_ids }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/live_snapshot.py --request-file .github/live-request.json
          else
            python3 scripts/live_snapshot.py --event-ids "$EVENT_IDS"
          fi
      # Post-output operation. The LIVE_SNAPSHOT_JSON line is the delivery boundary:
      # clients must publish candidates before waiting for this step or doing refresh/ledger work.
      - name: Post-output save of already published snapshot
        continue-on-error: true
        env:
          SNAPSHOT_PATH: ${{ steps.live.outputs.snapshot_path }}
        run: python3 scripts/save_live_snapshot.py

