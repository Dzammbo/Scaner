name: Manual BetsAPI live football snapshot

on:
  workflow_dispatch:
    inputs:
      event_ids:
        description: 'Empty: full scan. Otherwise 1-3 comma-separated IDs for refresh.'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - '.github/live-request.json'

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Select LIVE by frozen daily pockets and render four-line cards
        id: live
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          EVENT_IDS: ${{ inputs.event_ids }}
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            python3 scripts/live_snapshot.py --request-file .github/live-request.json
          else
            python3 scripts/live_snapshot.py --event-ids "$EVENT_IDS"
          fi
      - name: Optional prices for legacy snapshots only
        if: steps.live.outputs.prices_complete != 'true'
        continue-on-error: true
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          SNAPSHOT_PATH: ${{ steps.live.outputs.snapshot_path }}
        run: python3 scripts/live_snapshot.py --odds-snapshot "$SNAPSHOT_PATH"
      # LIVE_MARKDOWN_JSON is emitted first: display it immediately from streaming logs.
      # Do not wait for the full snapshot line, workflow completion or history save.
      # Persist the snapshot without generating a second candidate list.
      - name: Post-output save of already published snapshot
        continue-on-error: true
        env:
          SNAPSHOT_PATH: ${{ steps.live.outputs.snapshot_path }}
        run: python3 scripts/save_live_snapshot.py

