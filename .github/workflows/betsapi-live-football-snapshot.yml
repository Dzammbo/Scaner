name: Manual BetsAPI live football snapshot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/betsapi-live-football-snapshot.yml"

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - name: Fetch compact live football snapshot
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          BASE = "https://api.b365api.com"
          TOKEN = os.environ["BETSAPI_KEY"]
          EXCLUDE = re.compile(
              r"virtual|esoccer|e-soccer|esports|simulated|cyber|"
              r"women|woman|ladies|femenil|feminina|female|\\(w\\)|"
              r"\\bu[- ]?(?:15|16|17|18|19|20|21|22|23)\\b|youth|reserves?|development|juniors?",
              re.I,
          )

          def get(path, **params):
              params["token"] = TOKEN
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent": "dzam-live-tb/1.0"})
              with urllib.request.urlopen(req, timeout=20) as r:
                  return json.load(r), {
                      "status": r.status,
                      "limit": r.headers.get("X-RateLimit-Limit"),
                      "remaining": r.headers.get("X-RateLimit-Remaining"),
                  }

          def name(x):
              return x.get("name") if isinstance(x, dict) else x

          def num(x):
              try:
                  return float(x)
              except Exception:
                  return None

          def integer(x):
              try:
                  return int(float(x))
              except Exception:
                  return None

          def handicap(x):
              vals = [num(v.strip()) for v in str(x or "").replace("/", ",").split(",")]
              vals = [v for v in vals if v is not None]
              return sum(vals) / len(vals) if vals else None

          def latest(rows):
              rows = [r for r in (rows or []) if isinstance(r, dict)]
              return sorted(rows, key=lambda r: integer(r.get("add_time")) or 0, reverse=True)

          board, board_meta = get("/v3/events/inplay", sport_id=1)
          raw = [r for r in (board.get("results") or []) if isinstance(r, dict)]
          events = []
          for r in raw:
              league = name(r.get("league")) or ""
              home = name(r.get("home")) or ""
              away = name(r.get("away")) or ""
              label = " ".join((league, home, away))
              minute = integer((r.get("timer") or {}).get("tm"))
              score = str(r.get("ss") or "").replace(":", "-")
              if EXCLUDE.search(label) or minute is None or not (8 <= minute <= 84) or not re.fullmatch(r"\\d+-\\d+", score):
                  continue
              events.append({
                  "event_id": str(r.get("id")),
                  "league": league,
                  "country": (r.get("league") or {}).get("cc") if isinstance(r.get("league"), dict) else None,
                  "home": home,
                  "away": away,
                  "minute": minute,
                  "score": score,
                  "board_stats": r.get("stats"),
              })

          # Keep coverage broad but bound provider usage. Prefer matches with more time left.
          events = sorted(events, key=lambda e: (e["minute"], e["league"], e["home"]))[:30]

          def detail(ev):
              try:
                  p, meta = get("/v2/event/odds", event_id=ev["event_id"], source="bet365", odds_market="1,2,3")
                  rr = p.get("results") or {}
                  odds = rr.get("odds") or {}
                  score = ev["score"]
                  now = int(time.time())

                  totals = []
                  seen = set()
                  for row in latest(odds.get("1_3")):
                      row_score = str(row.get("ss") or "").replace(":", "-")
                      age = now - integer(row.get("add_time")) if integer(row.get("add_time")) is not None else None
                      line = handicap(row.get("handicap"))
                      over, under = num(row.get("over_od")), num(row.get("under_od"))
                      if row_score and row_score != score:
                          continue
                      if age is not None and not (0 <= age <= 240):
                          continue
                      if line is None or over is None or under is None:
                          continue
                      key = round(line, 3)
                      if key in seen:
                          continue
                      seen.add(key)
                      totals.append({"line": line, "over": over, "under": under, "age_s": age, "quote_score": row_score or score})
                      if len(totals) >= 6:
                          break

                  one_x_two = None
                  for row in latest(odds.get("1_1")):
                      row_score = str(row.get("ss") or "").replace(":", "-")
                      age = now - integer(row.get("add_time")) if integer(row.get("add_time")) is not None else None
                      if row_score and row_score != score:
                          continue
                      if age is not None and not (0 <= age <= 240):
                          continue
                      vals = [num(row.get(k)) for k in ("home_od", "draw_od", "away_od")]
                      if all(v is not None for v in vals):
                          one_x_two = {"home": vals[0], "draw": vals[1], "away": vals[2], "age_s": age}
                          break

                  out = dict(ev)
                  out.update({
                      "detail_ok": bool(p.get("success")),
                      "detail_stats": rr.get("stats"),
                      "totals": totals,
                      "one_x_two": one_x_two,
                      "api_remaining": meta.get("remaining"),
                  })
                  return out
              except Exception as exc:
                  out = dict(ev)
                  out.update({"detail_ok": False, "error": type(exc).__name__ + ": " + str(exc)[:180]})
                  return out

          detailed = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = [pool.submit(detail, ev) for ev in events]
              for f in as_completed(futures):
                  detailed.append(f.result())
          detailed.sort(key=lambda e: (e["minute"], e["league"], e["home"]))

          result = {
              "generated_at_utc": datetime.now(timezone.utc).isoformat(),
              "source": "BetsAPI / Bet365",
              "board_http": board_meta,
              "raw_live_count": len(raw),
              "eligible_adult_men_count": len(events),
              "detail_calls": len(events),
              "events": detailed,
          }
          print("LIVE_SNAPSHOT_JSON=" + json.dumps(result, ensure_ascii=False, separators=(",", ":")))
          PY
