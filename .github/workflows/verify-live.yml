name: Verify live collection without API calls

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/verify-live.yml'
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/verify-live.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Unit, integration and full-pool regression checks
        run: python3 -m unittest discover -s tests -v
        env:
          PYTHONDONTWRITEBYTECODE: '1'
