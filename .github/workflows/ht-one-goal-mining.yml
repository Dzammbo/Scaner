name: HT one-goal Mining

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "1-59/5 * * * *"
    - cron: "2-59/5 * * * *"
    - cron: "3-59/5 * * * *"
    - cron: "4-59/5 * * * *"
  push:
    branches: [main]
    paths:
      - "ht_one_goal_mining.py"
      - ".github/workflows/ht-one-goal-mining.yml"

permissions:
  contents: write

concurrency:
  group: mining-forward-log
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate shared Mining budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          now=datetime.now(timezone.utc);used=0
          for p in Path("mining_log").glob("**/*runs*.jsonl"):
            for line in p.read_text(encoding="utf-8").splitlines():
              try:
                row=json.loads(line);ts=datetime.fromisoformat(str(row["timestamp"]).replace("Z","+00:00"))
              except Exception:continue
              if now-timedelta(hours=1)<=ts<=now:used+=int(row.get("api_calls") or 0)
          run_budget=min(10,max(0,1150-used));skip=run_budget<4
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"HT_SKIP={'1' if skip else '0'}\n")
            f.write(f"HT_ONE_GOAL_CALL_BUDGET={max(4,run_budget)}\n")
            f.write(f"HT_ONE_GOAL_DETAIL_BUDGET={max(1,run_budget-1)}\n")
          print(json.dumps({"used_last_hour":used,"run_budget":run_budget,"skip":skip}))
          PY

      - name: Collect and settle signals
        if: env.HT_SKIP != '1'
        run: python3 ht_one_goal_mining.py

      - name: Validate output
        if: env.HT_SKIP != '1'
        run: |
          python3 -m py_compile ht_one_goal_mining.py
          test -s mining_log/ht_one_goal/status.json
          grep -q 'football_ht_one_goal_second_half_v1' mining_log/ht_one_goal/status.json

      - name: Persist Mining evidence
        if: env.HT_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mining_log/ht_one_goal/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Append HT one-goal Mining evidence"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt*3))
          done
