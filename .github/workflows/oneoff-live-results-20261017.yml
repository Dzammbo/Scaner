name: One-off requested live results 2026-10-17
on:
  push:
    branches: [main]
    paths: ['.github/workflows/oneoff-live-results-20261017.yml']
permissions:
  contents: read
jobs:
  results:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Read results for published selections only
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: |
          python3 - <<'PY'
          import json,os,urllib.parse,urllib.request,datetime
          from concurrent.futures import ThreadPoolExecutor
          ids=["12051803","12051809","12051807","12049987","12050633","12049986","12049980","12049979","12049984","11303482","13016133","11304620","13304200","12050631","13122420","13104215","12139455","13308105","12260000","13306033","12147543","11290379","11315096","13015982","12150084","12026470","12337544","13045586","12090258","12143630","11450808","12389362","11288926","12473296","11677042","12287079","13291444","12287154","13119891","13108478","12331102","12202849","12286977","13285480","12147898","12332278","13276125","13191366","12274600","13191368","12301873","12370818","12245841","12101661","12287077","12246916","13247010","12152695","11151429","12031936","12122280","12105186","12026468","13252046","12077140","13306201","12312253","13120376","12332103","12138137","12069441","12031626","13048597","12283442","12413811","13304324","12453631","13304079","12029955","11996875","11176328","12333118","12246821","13036836","11419940","12160490","13304153","12430622","13293345","13010407","12071050","12025042","11518420","13304429","11178793","12026897","12031625"]
          key=os.environ['BETSAPI_KEY']
          def fetch(batch):
              try:
                  url='https://api.b365api.com/v1/event/view?'+urllib.parse.urlencode({'token':key,'event_id':','.join(batch)})
                  with urllib.request.urlopen(url,timeout=25) as r: p=json.load(r)
                  rows=p.get('results',[])
                  return {'requested':batch,'success':p.get('success'),'results':[{k:e.get(k) for k in ['id','time_status','ss','scores','home','away','league','time','timer','events']} for e in rows if isinstance(e,dict)]}
              except Exception as e:
                  return {'requested':batch,'success':0,'error_type':type(e).__name__}
          with ThreadPoolExecutor(max_workers=4) as pool:
              batches=list(pool.map(fetch,[ids[i:i+10] for i in range(0,len(ids),10)]))
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'source':'BetsAPI event/view','batches':batches}
          print('DAILY_RESULTS_JSON='+json.dumps(out,ensure_ascii=False,separators=(',',':')).replace(key,'[redacted]'))
          
          PY
