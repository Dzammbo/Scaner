name: Mining GitHub hot path

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mining-general-log
  cancel-in-progress: false

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      SCANER_MODE: mining
      SCANER_ONLY_STRATEGIES: S09,S21,S22,S25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Calculate rolling Mining budget
        shell: bash
        run: |
          python3 - <<'PY'
          import json,os
          from datetime import datetime,timezone,timedelta
          from pathlib import Path
          from zoneinfo import ZoneInfo
          now=datetime.now(timezone.utc);used=0
          morning=7<=now.astimezone(ZoneInfo("Europe/Moscow")).hour<12
          cap=800 if morning else 1600
          per_pass=int(os.environ.get("MINING_PASS_CAP","12"))//(2 if morning else 1)
          board_calls=2
          for p in Path("mining_log").glob("**/*runs*.jsonl"):
            for line in p.read_text(encoding="utf-8").splitlines():
              try:r=json.loads(line);ts=datetime.fromisoformat(str(r["timestamp"]).replace("Z","+00:00"))
              except Exception:continue
              if now-timedelta(hours=1)<=ts<=now:used+=int(r.get("api_calls") or 0)
          run_budget=min(per_pass,max(0,cap-used));skip=run_budget<board_calls
          with open(os.environ["GITHUB_ENV"],"a") as f:
            f.write(f"SCANER_SKIP={'1' if skip else '0'}\n")
            f.write(f"SCANER_DETAIL_BUDGET={max(0,run_budget-board_calls)}\n")
          print(json.dumps({"morning_msk":morning,"hourly_cap":cap,"per_pass_cap":per_pass,"used_last_hour":used,"run_budget":run_budget,"detail_budget":max(0,run_budget-board_calls),"skip":skip}))
          PY
        env:
          MINING_PASS_CAP: 40

      - name: Run Mining collector
        if: env.SCANER_SKIP != '1'
        run: python3 scanner.py

      - name: Persist Mining evidence
        if: env.SCANER_SKIP != '1'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mining_log/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Append GitHub Mining evidence"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt*3))
          done

      - name: Verify result
        if: env.SCANER_SKIP != '1'
        run: |
          test -s result.json
          grep -q '"MINING_GITHUB_V1"' result.json
