name: Mining pending refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "2 */2 * * *"
  push:
    branches: [main]
    paths:
      - "mining_pending_refresh.py"
      - ".github/workflows/mining-pending-refresh.yml"

permissions:
  contents: write

concurrency:
  group: mining-pending-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      MINING_SETTLEMENT_QUERY_BUDGET: "50"
      MINING_SETTLEMENT_RETRY_SECONDS: "7200"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Refresh pending events from BetsAPI
        run: python3 mining_pending_refresh.py

      - name: Validate output
        run: |
          test -s mining_log/pending_refresh/status.json
          test -s mining_log/pending_refresh/results.jsonl
          test -s mining_log/settlement_statistics.json
          test -s mining_log/stateful_goal/status.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("mining_log/pending_refresh/status.json").read_text())
          statistics=json.loads(Path("mining_log/settlement_statistics.json").read_text())
          operational=json.loads(Path("mining_log/stateful_goal/status.json").read_text())
          assert status["provider_queries"] <= 80
          assert not status["errors"], status["errors"]
          assert status["stateful_duplicate_signals"] == 0, status
          for key, arm in operational["arms"].items():
              source=statistics["strategies"]["stateful"][key]
              direct=source["direct"]
              assert arm["signals"] == source["signals"], (key, arm, source)
              assert arm["pending"] == source["pending"], (key, arm, source)
              assert arm["void"] == source["void"], (key, arm, source)
              assert arm["N"] == direct["N"], (key, arm, direct)
              assert arm["balance_valid"], (key, arm)
          PY

      - name: Commit refreshed results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mining_log/pending_refresh/ mining_log/settlement_statistics.json mining_log/stateful_goal/signals.jsonl mining_log/stateful_goal/status.json
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi
          git commit -m "Refresh Mining pending results"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            if [ "$attempt" -eq 5 ]; then
              exit 1
            fi
            sleep $((attempt * 3))
          done
