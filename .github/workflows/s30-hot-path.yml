name: S30 continuous worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scanner.py"
      - "s30_worker.py"
      - "strategies.json"
      - ".github/workflows/s30-hot-path.yml"
  schedule:
    # Hourly watchdog. A queued run takes over when the long worker exits.
    # Minute 17 avoids the busiest start-of-hour scheduling window.
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: s30-continuous-worker
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      S30_DURATION_SECONDS: ${{ github.event_name == 'schedule' && '19200' || '130' }}
      S30_POLL_SECONDS: "55"
      S30_CHECKPOINT_SECONDS: "600"
      S30_GIT_CHECKPOINT: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run continuous S30 collector
        run: python3 s30_worker.py

      - name: Show worker status
        if: always()
        run: |
          test -f forward_log/s30/worker_status.json
          cat forward_log/s30/worker_status.json
