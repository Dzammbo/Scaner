name: Manual Events live tennis
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tennis/request.json']
permissions:
  contents: write
jobs:
  tennis:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Collect Events tennis
        id: tennis
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: python3 tennis/collect.py
      - name: Save snapshot
        env:
          SNAPSHOT_PATH: ${{ steps.tennis.outputs.snapshot_path }}
        run: python3 tennis/save.py
