name: Background unified Live collector
on:
  workflow_dispatch:
    inputs:
      verify_recovery:
        type: boolean
        default: false
        description: Exit deliberately after one saved capture to verify recovery
permissions:
  contents: write
  actions: read
concurrency:
  group: background-dual-live
  cancel-in-progress: false
jobs:
  capture:
    name: Resident shared collector 320 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: research/selection-lab-20261018
          path: collector
      - name: Run resident collector
        id: worker
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          GH_TOKEN: ${{ github.token }}
          COLLECTOR_ROOT: ${{ github.workspace }}/collector
          VERIFY_RECOVERY: ${{ inputs.verify_recovery }}
        run: python3 control/.github/scripts/live_runtime.py worker
      - name: Preserve latest cycle backup
        if: always() && steps.worker.outputs.capture_id != ''
        uses: actions/upload-artifact@v4
        with:
          name: background-live-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 30
          if-no-files-found: ignore
          path: |
            collector/research/live-background/experimental/snapshots/${{ steps.worker.outputs.capture_day }}/${{ steps.worker.outputs.capture_id }}.json.gz
            collector/research/live-background/experimental/receipts/${{ steps.worker.outputs.capture_day }}/${{ steps.worker.outputs.capture_id }}.json.gz
            collector/research/live-background/experimental/outcomes/${{ steps.worker.outputs.capture_day }}/${{ steps.worker.outputs.capture_id }}.json.gz
