name: Bet365 tennis collector smoke test

on:
  push:
    paths:
      - '.github/workflows/bet365-full-market-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Run one real Bet365 tennis collection pass
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          BET365_TENNIS_PREMATCH: "1"
        run: |
          set -euo pipefail
          python3 -m unittest tests.test_bet365_tennis
          python3 bet365_tennis.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          status=json.loads(Path("forward_log/bet365_tennis/status.json").read_text())
          print("SMOKE_STATUS="+json.dumps(status,ensure_ascii=False,separators=(",",":")))
          assert status["api_calls"] > 0
          assert status["inplay_events"] > 0
          assert status["details_fetched"] > 0
          assert not status["errors"], status["errors"]
          PY
