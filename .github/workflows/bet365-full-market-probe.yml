name: Bet365 full-market entitlement probe

on:
  push:
    paths:
      - '.github/workflows/bet365-full-market-probe.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Probe upcoming football and one prematch market catalogue
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, sys, urllib.parse, urllib.request

          token = os.environ["BETSAPI_KEY"]
          base = "https://api.b365api.com"

          def get(path, **params):
              params["token"] = token
              url = base + path + "?" + urllib.parse.urlencode(params)
              try:
                  with urllib.request.urlopen(url, timeout=25) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  print(json.dumps({"endpoint": path, "http_status": e.code, "body": body[:500]}))
                  raise

          status, upcoming = get("/v1/bet365/upcoming", sport_id=1, page=1)
          results = upcoming.get("results") or []
          print(json.dumps({
              "endpoint": "/v1/bet365/upcoming",
              "http_status": status,
              "success": upcoming.get("success"),
              "pager": upcoming.get("pager"),
              "events_returned": len(results),
              "first_event_keys": sorted(results[0].keys()) if results else [],
              "first_event": {k: results[0].get(k) for k in ("id", "FI", "home", "away", "time", "league") if k in results[0]} if results else None,
          }, ensure_ascii=False))

          if not results:
              sys.exit("No fixtures returned, cannot test prematch catalogue")
          fixture = results[0]
          fi = fixture.get("FI") or fixture.get("id")
          status, prematch = get("/v4/bet365/prematch", FI=fi, raw=1)
          raw = prematch.get("results") or prematch.get("raw") or []
          raw_text = raw if isinstance(raw, str) else json.dumps(raw, ensure_ascii=False)
          print(json.dumps({
              "endpoint": "/v4/bet365/prematch",
              "http_status": status,
              "success": prematch.get("success"),
              "FI": fi,
              "top_level_keys": sorted(prematch.keys()),
              "raw_type": type(raw).__name__,
              "raw_length": len(raw_text),
              "market_groups_detected": raw_text.count("type=MG"),
              "sample": raw_text[:700],
          }, ensure_ascii=False))
          PY
