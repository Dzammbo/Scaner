name: Hockey period market audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "hockey_period_market_audit.py"
      - ".github/workflows/hockey-period-market-audit.yml"

permissions:
  contents: write

concurrency:
  group: hockey-period-market-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Validate audit
        run: |
          test -n "$BETSAPI_KEY"
          python3 -m py_compile hockey_period_market_audit.py
      - name: Probe hockey period totals
        run: python3 hockey_period_market_audit.py
      - name: Persist audit result
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market_audit/hockey_period_market_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record hockey period market audit"
          git pull --rebase origin main
          git push origin HEAD:main
