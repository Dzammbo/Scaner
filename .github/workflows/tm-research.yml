name: Isolated TM historical research
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['research/tm/request.json']
permissions:
  contents: write
concurrency:
  group: tm-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Explicit bounded research request
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: python3 research/tm/collect.py
      - name: Save only isolated research data
        if: always()
        run: python3 research/tm/save.py
