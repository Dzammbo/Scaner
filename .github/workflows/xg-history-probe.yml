name: Probe historical Bundesliga xG

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "xg_history_probe.py"
      - ".github/workflows/xg-history-probe.yml"

permissions:
  contents: write

concurrency:
  group: xg-history-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Probe historical xG
        run: |
          test -n "$BETSAPI_KEY"
          python3 -m py_compile xg_history_probe.py
          python3 xg_history_probe.py

      - name: Persist probe report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mining_log/xg_home_model/history_probe.json
          git commit -m "Record historical Bundesliga xG probe"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            [ "$attempt" -eq 5 ] && exit 1
            sleep $((attempt*3))
          done
