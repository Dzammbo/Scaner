name: Audit published Live choices
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-published-live.yml'
      - '.github/scripts/audit_published_live.py'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check published choices against final provider scores
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          AUDIT_DATE_MSK: '2026-10-28'
        run: python3 .github/scripts/audit_published_live.py
