name: Temporary EPL hypothesis discovery

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-epl-hypotheses.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Discover and validate EPL card hypotheses
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.parse, urllib.request
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          BASE="https://api.b365api.com"; TOKEN=os.environ["BETSAPI_KEY"]; LEAGUE_ID="94"
          YELLOW_RE=re.compile(r"(?i)\bYellow Card\b")
          TEAM_RE=re.compile(r"~\(([^()]*)\)\s*$")
          MINUTE_RE=re.compile(r"(?<!\d)(\d{1,3})(?:\+(\d{1,2}))?['’]?")

          def get(path,retries=5,**params):
              params["token"]=TOKEN
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"dzam-epl-hypotheses/1.0"})
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(req,timeout=40) as response: return json.load(response)
                  except Exception:
                      if attempt==retries-1: raise
                      time.sleep(1.5*(attempt+1))

          base_rows=[]; seen=set()
          for page in range(1,18):
              payload=get("/v3/events/ended",sport_id=1,league_id=LEAGUE_ID,page=page)
              rows=payload.get("results") or []
              if isinstance(rows,dict): rows=rows.get("events") or rows.get("results") or []
              for r in rows:
                  eid=str(r.get("id") or "")
                  if eid and eid not in seen and str(r.get("time_status"))=="3":
                      seen.add(eid); base_rows.append(r)
              if len(base_rows)>=550 or not rows: break
          base_rows.sort(key=lambda r:(int(r.get("time") or 0),int(r.get("id") or 0)),reverse=True)
          base_rows=base_rows[:500]
          if len(base_rows)!=500: raise RuntimeError(f"Expected 500, got {len(base_rows)}")

          ids=[str(r["id"]) for r in base_rows]
          def view(batch): return get("/v1/event/view",event_id=",".join(batch)).get("results") or []
          details={}
          with ThreadPoolExecutor(max_workers=10) as pool:
              fs=[pool.submit(view,ids[i:i+10]) for i in range(0,500,10)]
              for f in as_completed(fs):
                  for r in f.result(): details[str(r.get("id"))]=r

          def norm(s): return re.sub(r"[^a-z0-9]","",(s or "").lower())
          def belongs(a,b):
              a,b=norm(a),norm(b); return bool(a and b and (a in b or b in a))
          def score(row,base):
              m=re.match(r"\s*(\d+)\s*[-:]\s*(\d+)\s*$",str(row.get("ss") or base.get("ss") or ""))
              return (int(m.group(1)),int(m.group(2))) if m else (None,None)
          def referee(row):
              candidates=[]
              for k in ("referee","referee_name"):
                  if row.get(k): candidates.append(row[k])
              extra=row.get("extra")
              if isinstance(extra,dict):
                  for k,v in extra.items():
                      if "referee" in str(k).lower() and v: candidates.append(v)
              for v in candidates:
                  if isinstance(v,dict):
                      v=v.get("name") or v.get("value")
                  if isinstance(v,str) and v.strip(): return v.strip()
              return None

          matches=[]
          for base in base_rows:
              eid=str(base["id"]); row=details[eid]
              home=(row.get("home") or base.get("home") or {}).get("name")
              away=(row.get("away") or base.get("away") or {}).get("name")
              events=row.get("events") or []
              marker=next((i for i,e in enumerate(events) if "Score After First Half" in str(e.get("text") or "")),None)
              yellow=[]
              for i,e in enumerate(events):
                  txt=str(e.get("text") or "")
                  if not YELLOW_RE.search(txt): continue
                  if marker is not None and i<marker: yellow.append(txt)
                  elif marker is None:
                      mm=MINUTE_RE.search(txt)
                      if mm and int(mm.group(1))<=45: yellow.append(txt)
              hyc=ayc=unknown=0
              for txt in yellow:
                  mm=TEAM_RE.search(txt); label=mm.group(1).strip() if mm else ""
                  if belongs(label,home): hyc+=1
                  elif belongs(label,away): ayc+=1
                  else: unknown+=1
              if unknown: raise RuntimeError(f"Unknown team attribution {eid}: {yellow}")
              ts=int(row.get("time") or base.get("time") or 0)
              hs,as_=score(row,base)
              matches.append({"id":eid,"date":datetime.fromtimestamp(ts,timezone.utc).date().isoformat(),
                  "dow":datetime.fromtimestamp(ts,timezone.utc).weekday(),"hour":datetime.fromtimestamp(ts,timezone.utc).hour,
                  "home":home,"away":away,"hyc":hyc,"ayc":ayc,"yc":len(yellow),"under":len(yellow)<=1,
                  "hs":hs,"as":as_,"referee":referee(row)})

          newest=matches[:250]; older=matches[250:]

          def stat(rows):
              n=len(rows); w=sum(x["under"] for x in rows); l=n-w
              return {"n":n,"wins":w,"hit":w/n if n else None,
                      "roi":(w*.5-l)/n if n else None,
                      "avg_yc":sum(x["yc"] for x in rows)/n if n else None}

          def learn(rows):
              d=defaultdict(lambda:{"n":0,"own":0,"under":0,"pts":0,"games":0,"home_n":0,"home_own":0,"away_n":0,"away_own":0})
              for x in rows:
                  for team,own,side in ((x["home"],x["hyc"],"home"),(x["away"],x["ayc"],"away")):
                      d[team]["n"]+=1; d[team]["own"]+=own; d[team]["under"]+=x["under"]
                      d[team][side+"_n"]+=1; d[team][side+"_own"]+=own
                  if x["hs"] is not None:
                      d[x["home"]]["games"]+=1; d[x["away"]]["games"]+=1
                      if x["hs"]>x["as"]: d[x["home"]]["pts"]+=3
                      elif x["hs"]<x["as"]: d[x["away"]]["pts"]+=3
                      else: d[x["home"]]["pts"]+=1; d[x["away"]]["pts"]+=1
              out={}
              for t,v in d.items():
                  out[t]={**v,"own_avg":v["own"]/v["n"],"under_rate":v["under"]/v["n"],
                          "ppg":v["pts"]/v["games"] if v["games"] else None,
                          "home_own_avg":v["home_own"]/v["home_n"] if v["home_n"] else None,
                          "away_own_avg":v["away_own"]/v["away_n"] if v["away_n"] else None}
              return out

          old=learn(older)

          def split_rule(teamset):
              cats={
                  "both":[x for x in newest if x["home"] in teamset and x["away"] in teamset],
                  "one":[x for x in newest if (x["home"] in teamset) ^ (x["away"] in teamset)],
                  "none":[x for x in newest if x["home"] not in teamset and x["away"] not in teamset],
                  "any":[x for x in newest if x["home"] in teamset or x["away"] in teamset],
              }
              return {k:stat(v) for k,v in cats.items()}

          fixed_sets={
              "core3":{"Arsenal","Liverpool","Man City"},
              "core4":{"Arsenal","Liverpool","Man City","Man Utd"},
              "big6":{"Arsenal","Chelsea","Liverpool","Man City","Man Utd","Tottenham"},
              "big6_without_chelsea_tottenham":{"Arsenal","Liverpool","Man City","Man Utd"},
          }
          fixed={k:{"teams":sorted(v),"validation":split_rule(v)} for k,v in fixed_sets.items()}

          eligible=[t for t,v in old.items() if v["n"]>=15]
          ranked_own=sorted(eligible,key=lambda t:(old[t]["own_avg"],-old[t]["n"]))
          ranked_under=sorted(eligible,key=lambda t:(old[t]["under_rate"],old[t]["n"]),reverse=True)
          learned={}
          for k in (3,4,5,6,8):
              s=set(ranked_own[:k])
              learned[f"lowest_own_top{k}"]={"teams":ranked_own[:k],"training":[{"team":t,"n":old[t]["n"],"own_avg":old[t]["own_avg"]} for t in ranked_own[:k]],"validation":split_rule(s)}
              s=set(ranked_under[:k])
              learned[f"highest_under_top{k}"]={"teams":ranked_under[:k],"training":[{"team":t,"n":old[t]["n"],"under_rate":old[t]["under_rate"]} for t in ranked_under[:k]],"validation":split_rule(s)}

          # Prospective score from older team-specific own-card averages.
          scored=[]
          for x in newest:
              if x["home"] in old and x["away"] in old and old[x["home"]]["n"]>=15 and old[x["away"]]["n"]>=15:
                  y=dict(x)
                  y["expected"]=old[x["home"]]["own_avg"]+old[x["away"]]["own_avg"]
                  y["under_prior"]=(old[x["home"]]["under_rate"]+old[x["away"]]["under_rate"])/2
                  if old[x["home"]]["ppg"] is not None and old[x["away"]]["ppg"] is not None:
                      y["ppg_gap"]=abs(old[x["home"]]["ppg"]-old[x["away"]]["ppg"])
                  else: y["ppg_gap"]=None
                  scored.append(y)

          expected_bins={
              "expected_le_0_8":[x for x in scored if x["expected"]<=.8],
              "expected_0_8_1_0":[x for x in scored if .8<x["expected"]<=1.0],
              "expected_1_0_1_2":[x for x in scored if 1.0<x["expected"]<=1.2],
              "expected_gt_1_2":[x for x in scored if x["expected"]>1.2],
              "under_prior_ge_0_72":[x for x in scored if x["under_prior"]>=.72],
              "under_prior_0_66_0_72":[x for x in scored if .66<=x["under_prior"]<.72],
              "under_prior_lt_0_66":[x for x in scored if x["under_prior"]<.66],
              "ppg_gap_ge_0_8":[x for x in scored if x["ppg_gap"] is not None and x["ppg_gap"]>=.8],
              "ppg_gap_lt_0_3":[x for x in scored if x["ppg_gap"] is not None and x["ppg_gap"]<.3],
          }

          # Home/away and calendar hypotheses on independent validation.
          simple={
              "weekend":[x for x in newest if x["dow"]>=5],
              "weekday":[x for x in newest if x["dow"]<5],
              "early_utc_before_15":[x for x in newest if x["hour"]<15],
              "late_utc_18_or_later":[x for x in newest if x["hour"]>=18],
          }

          # Referee profile learned only on old sample, if covered.
          old_refs=defaultdict(list)
          for x in older:
              if x["referee"]: old_refs[x["referee"]].append(x)
          low_refs={r for r,rows in old_refs.items() if len(rows)>=8 and stat(rows)["hit"]>=.75}
          high_refs={r for r,rows in old_refs.items() if len(rows)>=8 and stat(rows)["hit"]<=.60}
          referee_out={
              "coverage_old":sum(bool(x["referee"]) for x in older),
              "coverage_new":sum(bool(x["referee"]) for x in newest),
              "low_referees_training":[{"referee":r,**stat(old_refs[r])} for r in sorted(low_refs)],
              "high_referees_training":[{"referee":r,**stat(old_refs[r])} for r in sorted(high_refs)],
              "low_validation":stat([x for x in newest if x["referee"] in low_refs]),
              "high_validation":stat([x for x in newest if x["referee"] in high_refs]),
          }

          print("BASE_JSON="+json.dumps({"all":stat(matches),"training_old250":stat(older),"validation_new250":stat(newest),"date_from":matches[-1]["date"],"date_to":matches[0]["date"]},ensure_ascii=False,separators=(",",":")))
          print("FIXED_JSON="+json.dumps(fixed,ensure_ascii=False,separators=(",",":")))
          print("LEARNED_JSON="+json.dumps(learned,ensure_ascii=False,separators=(",",":")))
          print("BINS_JSON="+json.dumps({k:stat(v) for k,v in expected_bins.items()},ensure_ascii=False,separators=(",",":")))
          print("SIMPLE_JSON="+json.dumps({k:stat(v) for k,v in simple.items()},ensure_ascii=False,separators=(",",":")))
          print("REFEREE_JSON="+json.dumps(referee_out,ensure_ascii=False,separators=(",",":")))
          print("OLD_TEAMS_JSON="+json.dumps([{"team":t,**old[t]} for t in sorted(eligible,key=lambda t:old[t]["own_avg"])],ensure_ascii=False,separators=(",",":")))
          PY
