name: One-time BetsAPI result audit

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/betsapi-one-time-result-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - name: Fetch final scores by event ID
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          from concurrent.futures import ThreadPoolExecutor, as_completed

          BASE = "https://api.b365api.com"
          TOKEN = os.environ["BETSAPI_KEY"]
          IDS = ["12477002","12299758","13234372","13285570","13234373","12202850","13234392","12325195","13285445","12062993","12126208","12062983","12063011","13285678","12325194","12471952","12407691","12403135","12403105","13217859","12375322","12407688","13285866","12403337","12403104","12319683","12319678","13246864","13267993","12159729","12063004","13288669","12407699","12457698","13285299","12319680","13217858","13285298","12062985","13217800","12407276","12403134","12411994","13284855","12273461","12261910","13041499","13041972"]

          def name(x):
              return x.get("name") if isinstance(x, dict) else x

          def fetch(event_id):
              try:
                  query = urllib.parse.urlencode({"token": TOKEN, "event_id": event_id})
                  req = urllib.request.Request(BASE + "/v1/event/view?" + query, headers={"User-Agent": "dzam-result-audit/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      payload = json.load(response)
                  results = payload.get("results") or []
                  event = results[0] if results and isinstance(results[0], dict) else {}
                  return {
                      "event_id": event_id,
                      "success": bool(payload.get("success")),
                      "home": name(event.get("home")),
                      "away": name(event.get("away")),
                      "league": name(event.get("league")),
                      "time_status": event.get("time_status"),
                      "score": event.get("ss"),
                      "scores": event.get("scores"),
                      "start_time": event.get("time"),
                  }
              except Exception as exc:
                  return {"event_id": event_id, "success": False, "error": type(exc).__name__ + ": " + str(exc)[:180]}

          rows = []
          with ThreadPoolExecutor(max_workers=8) as pool:
              futures = {pool.submit(fetch, event_id): event_id for event_id in IDS}
              for future in as_completed(futures):
                  rows.append(future.result())
          rows.sort(key=lambda row: IDS.index(row["event_id"]))
          print("RESULT_AUDIT_JSON=" + json.dumps(rows, ensure_ascii=False, separators=(",", ":")))
          PY
