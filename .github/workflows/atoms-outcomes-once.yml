name: One-off requested full-history outcome audit
on:
  push:
    branches: [main]
    paths: ['.github/workflows/atoms-outcomes-once.yml']
permissions:
  contents: read
jobs:
  outcomes:
    if: "!contains(github.event.head_commit.message, 'Remove temporary')"
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Fetch only missing outcomes
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: |
          python3 - <<'PY'
          import os,json,time,urllib.request,urllib.parse,concurrent.futures
          ids=["11161554","11162413","11306723","11338647","11350142","11359965","11446248","11518421","11518422","11519228","11623323","11623324","11623325","11623326","11623327","11993164","12022707","12022708","12025039","12026604","12030954","12069444","12088918","12088923","12108011","12127694","12137413","12139847","12152763","12155859","12159590","12187854","12192041","12201427","12281076","12281797","12286976","12312256","12331095","12391998","12454187","13005863","13023628","13048577","13087908","13092228","13119027","13134469","13157057","13165187","13213336","13215642","13225065","13228788","13228789","13228794","13247011","13284610","13294395","13297364","13297365","13297366","13297367","13297807","13298011","13298817","13298818","13298872","13299160","13299467","13299594","13299596","13300530","13302935","13303428","13303429","13305697","13309168","13310722"]
          def fetch(eid):
              try:
                  q=urllib.parse.urlencode({"token":os.environ["BETSAPI_KEY"],"event_id":eid})
                  with urllib.request.urlopen("https://api.b365api.com/v1/event/view?"+q,timeout=20) as f: p=json.load(f)
                  a=p.get("results")or[]
                  if not a:return eid,{"error":"empty_result","checked_at":time.time()}
                  e=a[0]
                  return eid,{"id":eid,"time_status":e.get("time_status"),"ss":e.get("ss"),"scores":e.get("scores"),"home":(e.get("home")or{}).get("name"),"away":(e.get("away")or{}).get("name"),"checked_at":time.time(),"source":"BetsAPI /v1/event/view"}
              except Exception as e:return eid,{"error":type(e).__name__,"checked_at":time.time()}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
              for eid,r in pool.map(fetch,ids):
                  print("ATOM_RESULT="+json.dumps({"id":eid,"result":r},ensure_ascii=False),flush=True)
          
          PY
