name: Current Scanner status
on:
  workflow_dispatch:
permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      SCANNER_SETTLEMENT_QUERY_BUDGET: "80"
      SCANNER_SETTLEMENT_BOOTSTRAP_QUERY_BUDGET: "300"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Calculate fresh Scanner status
        run: |
          python3 scanner_settlement.py
          python3 current_status.py
      - name: Persist current statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add forward_log/settlement/ current_status_current.json priority_pockets_current.json pockets_current.json pending_current.json settlement_diagnostics_current.json observation_watchlist_current.json
          if git diff --cached --quiet; then
            echo "No statistics changes"
            exit 0
          fi
          git commit -m "Refresh current Scanner statistics"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: pending-current
          path: |
            priority_pockets_current.json
            pockets_current.json
            current_status_current.json
            pending_current.json
            settlement_diagnostics_current.json
            observation_watchlist_current.json
