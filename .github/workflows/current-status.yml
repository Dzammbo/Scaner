name: Current Scanner status
on:
  schedule:
    - cron: "37 */4 * * *"
  push:
    branches: [main]
    paths: ["current_status.py","recovery/selectel_scanner_signals_current.jsonl"]
permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Calculate fresh Scanner status
        run: python3 current_status.py
      - name: Persist current statistics
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current_status_current.json priority_pockets_current.json pockets_current.json
          if git diff --cached --quiet; then
            echo "No statistics changes"
            exit 0
          fi
          git commit -m "Refresh current Scanner statistics"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep $((attempt * 2))
          done
          exit 1
      - name: Supplement pending with web settlement
        continue-on-error: true
        run: python3 web_mass_settle.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: pending-current
          path: |
            priority_pockets_current.json
            pockets_current.json
            current_status_current.json
            pending_current.json
            web_mass_settlement.json
