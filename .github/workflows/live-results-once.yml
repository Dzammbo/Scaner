name: One-time requested outcome check
on:
  push:
    branches: [main]
    paths: ['research/live-results-20261018/fetch_once.py']
permissions:
  contents: read
jobs:
  outcomes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Read requested event outcomes
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: python3 research/live-results-20261018/fetch_once.py
