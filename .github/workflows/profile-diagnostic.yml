name: Temporary goal profile endpoint diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/profile-diagnostic.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - name: Probe league history without changing scanner data
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        run: |
          PYTHONPATH=scripts python3 - <<'PY'
          import json, time
          from concurrent.futures import ThreadPoolExecutor
          from live_snapshot import get
          def probe(task):
              version, league = task
              start = time.monotonic()
              out = dict(version=version, league=league)
              try:
                  p, meta = get('/'+version+'/events/ended', sport_id=1, league_id=league, page=1, _timeout=5)
                  out.update(http=meta.get('status'), success=p.get('success'), error_code=p.get('error'), results_n=len(p.get('results', [])), keys=list(p))
              except Exception as exc:
                  out.update(error_type=type(exc).__name__, http=getattr(exc, 'code', None))
              out['seconds']=round(time.monotonic()-start,3)
              return out
          with ThreadPoolExecutor(max_workers=4) as pool:
              for result in pool.map(probe, [('v3','176'),('v2','176'),('v3','4836'),('v2','4836')]):
                  print('PROFILE_DIAGNOSTIC='+json.dumps(result), flush=True)
          PY
