name: Check BETSAPI secret

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/check-betsapi-secret.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check secret
        run: python3 scripts/check_betsapi_secret.py
