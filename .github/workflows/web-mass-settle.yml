name: Mass web settle pending
on:
  push:
    branches: [main]
    paths: ["web_mass_settle.py"]
jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import urllib.request,zipfile
          u="https://sdmntprnortheu.oaiusercontent.com/files/00000000-7a60-81f4-96d6-98464a4d3ca1/raw?se=2026-09-29T14%3A49%3A55Z&sp=r&sv=2026-02-06&sr=b&scid=ac1b482a-737b-5585-8cb6-3d8662e89ee7&skoid=3804227d-1b52-417d-afd9-9ffbb50fa53e&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-29T06%3A42%3A14Z&ske=2026-09-30T06%3A42%3A14Z&sks=b&skv=2026-02-06&sig=T11U2WrmX0hpSyK0BibO3CCdN0%2BWS7mkMMKj5bTPW4A%3D"
          data=urllib.request.urlopen(u,timeout=30).read()
          open("/tmp/p.zip","wb").write(data)
          with zipfile.ZipFile("/tmp/p.zip") as z:z.extractall(".")
          PY
      - run: python3 web_mass_settle.py
      - uses: actions/upload-artifact@v4
        with:
          name: web-mass-settlement
          path: web_mass_settlement.json
