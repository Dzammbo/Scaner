name: Temporary UCL first half yellow card study

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-ucl-yellow-cards-study.yml'

permissions:
  contents: read

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Cross-check two provider inconsistencies
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.parse, urllib.request
          BASE = "https://api.b365api.com"
          TOKEN = os.environ["BETSAPI_KEY"]
          IDS = ["13041838", "10580528"]

          def get(path, **params):
              params["token"] = TOKEN
              url = BASE + path + "?" + urllib.parse.urlencode(params)
              req = urllib.request.Request(url, headers={"User-Agent":"dzam-ucl-yellow-crosscheck/1.0"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          output = []
          for event_id in IDS:
              view = (get("/v1/event/view", event_id=event_id).get("results") or [{}])[0]
              trend = get("/v1/event/stats_trend", event_id=event_id).get("results") or {}
              yc = trend.get("yellowcards") or {}
              at_45 = {}
              for side in ("home", "away"):
                  points = yc.get(side) or []
                  eligible = []
                  for point in points:
                      try:
                          minute = int(float(point.get("time_str")))
                          value = int(float(point.get("val")))
                      except Exception:
                          continue
                      if minute <= 45:
                          eligible.append((minute, value))
                  at_45[side] = max(eligible)[1] if eligible else 0
              marker = next((i for i,e in enumerate(view.get("events") or []) if "Score After First Half" in str(e.get("text") or "")), None)
              yellow_events = [
                  {"index":i,"text":str(e.get("text") or "")}
                  for i,e in enumerate(view.get("events") or [])
                  if "Yellow Card" in str(e.get("text") or "")
              ]
              output.append({
                  "event_id":event_id,
                  "home":(view.get("home") or {}).get("name"),
                  "away":(view.get("away") or {}).get("name"),
                  "trend_at_45":at_45,
                  "trend_total_at_45":sum(at_45.values()),
                  "halftime_marker_index":marker,
                  "timeline_yellow_events":yellow_events,
                  "timeline_before_marker":[x for x in yellow_events if marker is not None and x["index"] < marker],
                  "full_stats_yellowcards":(view.get("stats") or {}).get("yellowcards"),
              })
          print("CROSSCHECK_JSON=" + json.dumps(output, ensure_ascii=False, separators=(",",":")))
          PY
