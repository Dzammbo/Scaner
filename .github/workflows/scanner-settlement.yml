name: Scanner settlement

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: scanner-settlement
  cancel-in-progress: false

jobs:
  settle:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
      SCANNER_SETTLEMENT_QUERY_BUDGET: "100"
      SCANNER_SETTLEMENT_BOOTSTRAP_QUERY_BUDGET: "300"
      SCANNER_SETTLEMENT_RETRY_SECONDS: "7200"
      SCANNER_SETTLEMENT_WORKER_DURATION_SECONDS: "19200"
      SCANNER_SETTLEMENT_INTERVAL_SECONDS: "3600"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Keep settlement cache and statistics current
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          started="$(date +%s)"
          deadline="$((started + SCANNER_SETTLEMENT_WORKER_DURATION_SECONDS))"

          while [ "$(date +%s)" -lt "$deadline" ]; do
            # Reports are regenerated on every pass. Restore the committed copies
            # before rebasing so a previous pass can never block the next one.
            git restore --worktree -- \
              forward_log/settlement/results.jsonl \
              forward_log/settlement/status.json \
              current_status_current.json \
              priority_pockets_current.json \
              pockets_current.json \
              pending_current.json \
              settlement_diagnostics_current.json \
              s30_top6_current.json
            git pull --rebase origin main
            python3 scanner_settlement.py
            python3 current_status.py

            python3 - <<'PY'
          import json
          from pathlib import Path

          required = [
              "forward_log/settlement/results.jsonl",
              "forward_log/settlement/status.json",
              "current_status_current.json",
              "priority_pockets_current.json",
              "pockets_current.json",
              "pending_current.json",
              "settlement_diagnostics_current.json",
              "observation_watchlist_current.json",
              "s30_top6_current.json",
          ]
          for filename in required:
              assert Path(filename).is_file() and Path(filename).stat().st_size > 0, filename
          provider = json.loads(Path(required[1]).read_text())
          current = json.loads(Path(required[2]).read_text())
          assert provider["provider_queries"] <= provider["query_budget"]
          assert provider["due_events_remaining"] == 0
          assert current["merged"] == current["settled"] + current["void"] + current["pending"]
          assert {"S26", "S30"}.issubset(current["strategies"])
          PY

            git add forward_log/settlement/ current_status_current.json priority_pockets_current.json pockets_current.json pending_current.json settlement_diagnostics_current.json observation_watchlist_current.json s30_top6_current.json
            if ! git diff --cached --quiet; then
              git commit -m "Refresh Scanner settlement cache"
              pushed="0"
              for attempt in 1 2 3 4 5; do
                if git push origin HEAD:main; then
                  pushed="1"
                  break
                fi
                git pull --rebase origin main
                sleep $((attempt * 2))
              done
              test "$pushed" = "1"
            fi

            now="$(date +%s)"
            remaining="$((deadline - now))"
            if [ "$remaining" -le 0 ]; then
              break
            fi
            sleep_for="$SCANNER_SETTLEMENT_INTERVAL_SECONDS"
            if [ "$remaining" -lt "$sleep_for" ]; then
              sleep_for="$remaining"
            fi
            sleep "$sleep_for"
          done

      - name: Hand off to the next settlement worker
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          other_run="$(gh run list \
            --workflow scanner-settlement.yml \
            --limit 30 \
            --json databaseId,status \
            --jq '[.[] | select(.databaseId != '"$GITHUB_RUN_ID"' and (.status == "in_progress" or .status == "queued" or .status == "waiting" or .status == "pending" or .status == "requested"))] | length')"

          if [ "$other_run" = "0" ]; then
            gh workflow run scanner-settlement.yml --ref main
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scanner-settlement
          path: |
            forward_log/settlement/status.json
            current_status_current.json
            settlement_diagnostics_current.json
            observation_watchlist_current.json
            s30_top6_current.json
