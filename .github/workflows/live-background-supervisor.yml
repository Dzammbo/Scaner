name: Background Live supervisor
on:
  workflow_dispatch:
permissions:
  actions: write
  contents: write
concurrency:
  group: live-background-supervisor
  cancel-in-progress: false
jobs:
  supervise:
    name: Resident reserve supervisor 330 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Monitor and request recovery without cron
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/live_runtime.py supervisor
