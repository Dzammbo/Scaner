name: Temporary UCL team-tier card analysis

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp-ucl-team-tier-analysis.yml'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Analyze team tiers and first-half yellow cards
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          PYTHONDONTWRITEBYTECODE: '1'
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, re, time, urllib.error, urllib.parse, urllib.request
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from datetime import datetime, timezone

          BASE="https://api.b365api.com"
          TOKEN=os.environ["BETSAPI_KEY"]
          LEAGUE_ID="1040"
          YELLOW_RE=re.compile(r"(?i)\bYellow Card\b")
          TEAM_RE=re.compile(r"~\(([^()]*)\)\s*$")

          def get(path,retries=4,**params):
              params["token"]=TOKEN
              url=BASE+path+"?"+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={"User-Agent":"dzam-ucl-tier-study/1.0"})
              for attempt in range(retries):
                  try:
                      with urllib.request.urlopen(req,timeout=35) as response:
                          return json.load(response)
                  except Exception:
                      if attempt==retries-1: raise
                      time.sleep(1.5*(attempt+1))

          base_rows=[]; seen=set()
          for page in range(1,14):
              payload=get("/v3/events/ended",sport_id=1,league_id=LEAGUE_ID,page=page)
              rows=payload.get("results") or []
              if isinstance(rows,dict): rows=rows.get("events") or rows.get("results") or []
              for row in rows:
                  eid=str(row.get("id") or "")
                  if eid and eid not in seen and str(row.get("time_status"))=="3":
                      seen.add(eid); base_rows.append(row)
              if len(base_rows)>=550 or not rows: break
          base_rows.sort(key=lambda r:(int(r.get("time") or 0),int(r.get("id") or 0)),reverse=True)
          base_rows=base_rows[:500]
          if len(base_rows)!=500: raise RuntimeError(f"Expected 500, got {len(base_rows)}")

          ids=[str(r["id"]) for r in base_rows]
          def batch_view(batch):
              return get("/v1/event/view",event_id=",".join(batch)).get("results") or []
          details={}
          batches=[ids[i:i+10] for i in range(0,500,10)]
          with ThreadPoolExecutor(max_workers=10) as pool:
              futures=[pool.submit(batch_view,b) for b in batches]
              for f in as_completed(futures):
                  for row in f.result(): details[str(row.get("id"))]=row

          # Manual resolution based on external match protocols from the preceding audit.
          overrides={
              "10580528":{"total":0,"home":0,"away":0},
              "10580524":{"total":0,"home":0,"away":0},
              "10580161":{"total":0,"home":0,"away":0},
              "7157255":{"total":0,"home":0,"away":0},
              "7157240":{"total":1,"home":0,"away":1},
          }

          matches=[]
          team_appearances=Counter()
          own_observations=[]
          uncertain_team_assignment=0

          for base in base_rows:
              eid=str(base["id"]); row=details.get(eid) or {}
              home=(row.get("home") or base.get("home") or {}).get("name")
              away=(row.get("away") or base.get("away") or {}).get("name")
              team_appearances[home]+=1; team_appearances[away]+=1
              events=row.get("events") or []
              marker=next((i for i,e in enumerate(events) if "Score After First Half" in str(e.get("text") or "")),None)
              yellow=[]
              for idx,e in enumerate(events):
                  text=str(e.get("text") or "")
                  if YELLOW_RE.search(text) and (marker is None or idx<marker):
                      yellow.append(text)

              hyc=ayc=unknown=0
              for text in yellow:
                  m=TEAM_RE.search(text)
                  team=(m.group(1).strip() if m else "")
                  if team and (team.lower() in home.lower() or home.lower() in team.lower()):
                      hyc+=1
                  elif team and (team.lower() in away.lower() or away.lower() in team.lower()):
                      ayc+=1
                  else:
                      unknown+=1
              total=len(yellow)
              if eid in overrides:
                  total=overrides[eid]["total"]; hyc=overrides[eid]["home"]; ayc=overrides[eid]["away"]; unknown=0
              if unknown:
                  uncertain_team_assignment+=1

              ts=int(row.get("time") or base.get("time") or 0)
              match={
                  "id":eid,"date":datetime.fromtimestamp(ts,timezone.utc).date().isoformat(),
                  "home":home,"away":away,"home_yc":hyc,"away_yc":ayc,
                  "unknown_yc":unknown,"total_yc":total,"under":total<=1,
              }
              matches.append(match)
              if unknown==0:
                  own_observations.extend([
                      {"team":home,"yc":hyc,"match_id":eid},
                      {"team":away,"yc":ayc,"match_id":eid},
                  ])

          ranked=[team for team,count in team_appearances.most_common()]

          def stat(rows):
              n=len(rows); w=sum(bool(x["under"]) for x in rows); l=n-w
              return {"n":n,"wins":w,"losses":l,"hit":w/n if n else None,
                      "profit":w*0.5-l if n else None,
                      "roi":(w*0.5-l)/n if n else None,
                      "avg_yc":sum(x["total_yc"] for x in rows)/n if n else None}

          tiers=[]
          for k in (6,8,10,12,15,20):
              elite=set(ranked[:k])
              cats={
                  "both":[x for x in matches if x["home"] in elite and x["away"] in elite],
                  "one":[x for x in matches if (x["home"] in elite) ^ (x["away"] in elite)],
                  "none":[x for x in matches if x["home"] not in elite and x["away"] not in elite],
                  "any":[x for x in matches if x["home"] in elite or x["away"] in elite],
              }
              tier={"top_k":k,"teams":ranked[:k],"categories":{}}
              for cat,rows in cats.items():
                  newest=[x for x in rows if matches.index(x)<250]
                  older=[x for x in rows if matches.index(x)>=250]
                  tier["categories"][cat]={"all":stat(rows),"newest250":stat(newest),"older250":stat(older)}
              tiers.append(tier)

          top12=set(ranked[:12])
          elite_obs=[x for x in own_observations if x["team"] in top12]
          other_obs=[x for x in own_observations if x["team"] not in top12]
          def own_stat(obs):
              n=len(obs); total=sum(x["yc"] for x in obs)
              return {"team_match_observations":n,"yellow_cards":total,
                      "avg_own_yc":total/n if n else None,
                      "zero_card_share":sum(x["yc"]==0 for x in obs)/n if n else None,
                      "two_plus_share":sum(x["yc"]>=2 for x in obs)/n if n else None}
          own_comparison={"top12":own_stat(elite_obs),"others":own_stat(other_obs)}

          per_team=[]
          for team,count in team_appearances.most_common():
              team_matches=[x for x in matches if x["home"]==team or x["away"]==team]
              if len(team_matches)<20: continue
              # chronological halves within that team's own sample
              mid=len(team_matches)//2
              latest=team_matches[:mid]; older=team_matches[mid:]
              own=[x for x in own_observations if x["team"]==team]
              row={"team":team,"appearances":len(team_matches),"all":stat(team_matches),
                   "latest_half":stat(latest),"older_half":stat(older),"own":own_stat(own)}
              per_team.append(row)

          stable=[
              x for x in per_team
              if x["appearances"]>=24
              and x["all"]["hit"]>2/3
              and x["latest_half"]["hit"]>2/3
              and x["older_half"]["hit"]>2/3
          ]
          stable.sort(key=lambda x:(x["all"]["roi"],x["appearances"]),reverse=True)

          print("SUMMARY_JSON="+json.dumps({
              "matches":len(matches),"details":len(details),
              "date_from":matches[-1]["date"],"date_to":matches[0]["date"],
              "unique_teams":len(team_appearances),
              "uncertain_team_assignment_matches":uncertain_team_assignment,
              "top20_by_appearances":[{"team":t,"matches":team_appearances[t]} for t in ranked[:20]],
              "own_card_comparison_top12":own_comparison,
          },ensure_ascii=False,separators=(",",":")))
          print("TIERS_JSON="+json.dumps(tiers,ensure_ascii=False,separators=(",",":")))
          print("TEAMS_JSON="+json.dumps(per_team,ensure_ascii=False,separators=(",",":")))
          print("STABLE_JSON="+json.dumps(stable,ensure_ascii=False,separators=(",",":")))
          PY
