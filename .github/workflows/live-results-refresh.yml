name: Refresh confirmed Live results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/live-results-refresh.json'
permissions:
  contents: write
concurrency:
  group: explicit-live-results-refresh
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/live-results-refresh.json
            /.github/live-statistics-epoch.json
      - uses: actions/checkout@v4
        with:
          ref: research/selection-lab-20261018
          path: collector
          fetch-depth: 1
          sparse-checkout: |
            .github
            scripts
            research/selection-lab-20261018
            research/live-lab
            research/live-background
            research/live-results-refresh
            research/shadow-analysis
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scaner-statistics-cache
          key: statistics-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: statistics-inputs-v2-
      - name: Install fast JSON decoder
        run: python3 -m pip install orjson==3.11.3
      - name: Refresh unresolved outcomes and rebuild frozen-series statistics
        id: refresh
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          COLLECTOR_ROOT: ${{ github.workspace }}/collector
          EPOCH_CONFIG: ${{ github.workspace }}/control/.github/live-statistics-epoch.json
          STATISTICS_CACHE_DIR: ${{ runner.temp }}/scaner-statistics-cache
        run: python3 control/.github/scripts/refresh_live_results.py
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/scaner-statistics-cache
          key: statistics-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}
