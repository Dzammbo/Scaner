name: Refresh confirmed Live results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/live-results-refresh.json'
permissions:
  contents: write
concurrency:
  group: explicit-live-results-refresh
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/scripts/
            /.github/live-results-refresh.json
            /.github/live-statistics-epoch.json
      - uses: actions/checkout@v4
        with:
          ref: research/selection-lab-20261018
          path: collector
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            .github
            scripts
            research/selection-lab-20261018
      - uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/scaner-statistics-cache
          key: statistics-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}
          # The last complete prepublication manifest is retained for this
          # recovery run; subsequent saves use the normal per-run key.
          restore-keys: |
            statistics-inputs-v2-41008089412-1
            statistics-inputs-v2-
      - name: Install fast JSON decoder
        run: python3 -m pip install orjson==3.11.3
      - name: Restore verified history, fetching only changed blobs
        run: python3 control/.github/scripts/statistics_index.py hydrate collector '${{ runner.temp }}/scaner-statistics-cache'
      - name: Refresh unresolved outcomes and rebuild frozen-series statistics
        id: refresh
        env:
          BETSAPI_KEY: ${{ secrets.BETSAPI_KEY }}
          COLLECTOR_ROOT: ${{ github.workspace }}/collector
          EPOCH_CONFIG: ${{ github.workspace }}/control/.github/live-statistics-epoch.json
          STATISTICS_CACHE_DIR: ${{ runner.temp }}/scaner-statistics-cache
          STATISTICS_INPUT_MANIFEST: ${{ runner.temp }}/scaner-statistics-cache/history-index.json
        run: python3 control/.github/scripts/refresh_live_results.py
      - name: Update verified history index
        if: steps.refresh.outcome == 'success'
        run: python3 control/.github/scripts/statistics_index.py build collector '${{ runner.temp }}/scaner-statistics-cache'
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: ${{ runner.temp }}/scaner-statistics-cache
          key: statistics-inputs-v2-${{ github.run_id }}-${{ github.run_attempt }}
